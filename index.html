<!DOCTYPE html>
<html>
    <head>
        <title>Restaurant Order App</title>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 class="header-title">Jimmy's Diner</h1>
            <p class="header-text">The best burgers and pizzas in town.</p>  
        </header>
        <main>
            <section id="menu-items" class="menu-items container">
                    <!-- MENU ITEMS HERE -->
            </section>

            <section id="order-card" class="container order-card">

                <h3 class="section-header">Your Order</h3>

                <div id="ordered-items">
                    <!-- ORDERED ITEMS HERE -->
                </div>


                <div class="total-price-card">
                    <h3>Total Price</h3>
                    <p id="total-price" class="total-price"><!-- TOTAL PRICE HERE --></p>
                </div>

                <button data-complete="true" class="order-btn">Complete Order</button>

            </section>

            <section id="modal-overlay" class="modal-overlay container">
                <div class="confirmation-modal">
                    <h3 class="section-header">Enter Details</h3>
                    <form id="order-form" class="order-form">
                        <input class="input" type="text" id="name" placeholder="Enter your name" required/>
                        <input class="input" type="number" id="guest-number" placeholder="Number of guest" required/>
                        <input class="submit-btn" type="submit" value="Place Order"/>
                    </form>
                </div>
            </section>

            <section id="order-confirmation" class="order-confirmation">
                <h3 id="confirmation-text" class="confirmation-text"><!-- CONFIRMATION MESSAGE HERE --></h3>
            </section>


        </main>

	<script src="index.js" type="module"></script>
    </body>
</html>
